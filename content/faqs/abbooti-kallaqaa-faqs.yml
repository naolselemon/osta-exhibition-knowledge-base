    id: abbooti-smart-ac-generator-purpose-faq
    system_id: smart-ac-generator
    question: What is the Smart AC Generator?
    answer: The Smart AC Generator is an electrical-technology demonstration shown at the OSTA exhibition. The video shows the equipment with a visible control interface in a laboratory/workshop setting.
    kpi_observation_refs: []
    translations:
      om:
        question: Jenereetara AC Smaartii jechuun maali?
        answer: Jenereetaraan AC Smaartii agarsiisa OSTA irratti kan dhiyaate teeknoolojii jenereetaraa/elektirikaalaa fuula to’annoo mul’atu qabuudha. Viidiyoon kun meeshaa kana naannoo laaboraatoorii/workiishoop keessatti agarsiisa.
