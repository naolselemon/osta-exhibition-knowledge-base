records:
- schema_version: 1.0.0
  record_version: 1
  id: woredanet-vpn-kpi-faq
  system_id: woredanet-vpn
  question: What WoredaNet connectivity figures are recorded?
  answer: The extraction records {{kpi:woredanet-vpn-regional-lines-2025-published}}
    for regional VPN lines, {{kpi:woredanet-vpn-zone-city-lines-2025-published}} for
    zone-and-city lines, and {{kpi:woredanet-vpn-woreda-kebele-lines-2025-published}}
    for woreda-and-kebele lines. Technology counts are separate candidate scopes and
    require source-owner verification.
  kpi_observation_refs:
  - woredanet-vpn-regional-lines-2025-published
  - woredanet-vpn-zone-city-lines-2025-published
  - woredanet-vpn-woreda-kebele-lines-2025-published
  translations:
    om:
      question: Lakkoofsotni walqunnamtii WoredaNet maal galmaa’aniiru?
      answer: Qorannoon kun sararoota VPN naannoo 61, sararoota godinaa fi magaalaa
        879, akkasumas sararoota aanaa fi ganda 1,856 akka gabaafaman galmeessa. Lakkoofsotni
        teeknooloojii adda addaa himannaa qofa waan ta’aniif mirkaneessa abbaa ragaa
        barbaadu.
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-afaan-oromo-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
    am:
      question: የWoredaNet ግንኙነት ምን ዓይነት አኃዞችን ይይዛል?
      answer: ማጠቃለያው 61 የክልል ቪፒኤን መስመሮች፣ 879 የዞንና የከተማ መስመሮች እና 1,856 የወረዳና የቀበሌ መስመሮች
        እንደተመዘገቡ ይገልጻል። የቴክኖሎጂ አኃዞቹ የማጠቃለያ ጥያቄዎች ስለሆኑ ከምንጩ ባለቤት መረጋገጥ አለባቸው።
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-amharic-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
  publication_status: published
  data_classification: public
  contains_personal_data: false
  public_display_approved: true
  workflow:
    state: approved
    prepared_by_role: content-author
    reviewed_by_role: user-requested-publisher
    created_at: '2026-09-04'
    updated_at: '2026-09-04'
    notes: Published from the ETEX 2025 PDF per explicit user instruction; source-snapshot
      limitations remain recorded.
- schema_version: 1.0.0
  record_version: 1
  id: data-center-kpi-faq
  system_id: oromia-regional-data-center
  question: What data-center work is recorded?
  answer: The extraction records {{kpi:oromia-data-center-storage-2025-published}}
    of reported storage capacity and {{kpi:oromia-data-center-services-hosted-2025-published}}
    hosted services. Both are candidate claims from a video extraction and require
    technical and source-owner verification.
  kpi_observation_refs:
  - oromia-data-center-storage-2025-published
  - oromia-data-center-services-hosted-2025-published
  translations:
    om:
      question: Hojiiwwan wiirtuu deetaa irratti galmaa’an maali?
      answer: Qorannoon kun kuufama deetaa gabaafame {{kpi:oromia-data-center-storage-2025-published}}
        fi tajaajiloota keessummeeffaman {{kpi:oromia-data-center-services-hosted-2025-published}}
        galmeessa. Himannoowwan lamaan kunneen qorannoo viidiyoo irraa waan dhufaniif
        mirkaneessa teeknikaa fi abbaa ragaa barbaadu.
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-afaan-oromo-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
    am:
      question: ምን ዓይነት የመረጃ ማዕከል ሥራ ተመዝግቧል?
      answer: ማጠቃለያው {{kpi:oromia-data-center-storage-2025-published}} የተመዘገበ የማከማቻ
        አቅም እና {{kpi:oromia-data-center-services-hosted-2025-published}} የተስተናገዱ አገልግሎቶች
        እንዳሉ ይገልጻል። ሁለቱም ከቪዲዮ ማጠቃለያ የተገኙ የምንጭ ጥያቄዎች ስለሆኑ ቴክኒካዊና የምንጭ ባለቤት ማረጋገጫ ያስፈልጋቸዋል።
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-amharic-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
