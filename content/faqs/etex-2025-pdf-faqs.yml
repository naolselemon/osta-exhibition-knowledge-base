  record_version: 1
  id: regional-documents-kpi-faq
  system_id: regional-document-digitization
  question: What records-conversion work is recorded?
  answer: The extraction records {{kpi:regional-document-digitization-documents-2025-published}}
    as the reported regional document-digitization total. The counting rule, document
    inventory, and reporting timestamp still require verification.
  kpi_observation_refs:
  - regional-document-digitization-documents-2025-published
  translations:
    om:
      question: Hojii jijjiirraa galmeewwanii irratti galmeen maal jedhu?
      answer: Qorannoon kun waliigala dijitaaleessuu sanadootaa naannoo {{kpi:regional-document-digitization-documents-2025-published}}
        akka ta’e galmeessa. Seerri lakkaa’umsaa, kuusaan sanadootaa fi daangaan isaa
        ammallee mirkanaa’uu qabu.
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-afaan-oromo-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
    am:
      question: የክልሉ ሰነዶች ለውጥ ምን ውጤት እንዳለው ተመዝግቧል?
      answer: ማጠቃለያው የክልሉ የሰነድ ዲጂታላይዜሽን ጠቅላላ መጠን {{kpi:regional-document-digitization-documents-2025-published}}
        መሆኑን ይገልጻል። የቆጠራ መስፈርቱ፣ የሰነድ ማህደሩ እና ሽፋኑ አሁንም መረጋገጥ አለባቸው።
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-amharic-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
