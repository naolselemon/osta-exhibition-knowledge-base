- schema_version: 1.0.0
  record_version: 1
  id: rprs-kpi-faq
  system_id: rprs
  question: Which RPRS work figures are recorded?
  answer: The extraction records {{kpi:rprs-total-tasks-2025-published}}, {{kpi:rprs-certificates-issued-2025-published}},
    and {{kpi:rprs-parcels-migrated-2025-published}}. The source does not define the
    task, certificate, parcel, or reporting-period rules, so these remain candidate
    claims.
  kpi_observation_refs:
  - rprs-total-tasks-2025-published
  - rprs-certificates-issued-2025-published
  - rprs-parcels-migrated-2025-published
  translations:
    om:
      question: Lakkoofsotni hojii RPRS kam galmaa’aniiru?
      answer: Qorannoon kun {{kpi:rprs-total-tasks-2025-published}}, {{kpi:rprs-certificates-issued-2025-published}}
        fi {{kpi:rprs-parcels-migrated-2025-published}} akka galmaa’an ibsa. Maddaichi
        hiika hojii, ragaa, paarselii yookaan yeroo gabaasaa hin ibsine; kanaaf himannoowwan
        kun qoratamuu qabu.
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-afaan-oromo-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
    am:
      question: የትኞቹ የRPRS ሥራ አኃዞች ተመዝግበዋል?
      answer: ማጠቃለያው {{kpi:rprs-total-tasks-2025-published}}፣ {{kpi:rprs-certificates-issued-2025-published}}
        እና {{kpi:rprs-parcels-migrated-2025-published}} እንደተመዘገቡ ይገልጻል። ምንጩ የሥራ፣ የምስክር
        ወረቀት፣ የፓርሴል ወይም የሪፖርት ጊዜ ትርጉም ስላልገለጸ እነዚህ እንደ ጥያቄ የሚፈልጉ አኃዞች ናቸው።
      approval:
        status: approved
        human_reviewed: true
        reviewer_role: human-amharic-reviewer
        approved_source: false
        reviewed_at: '2026-09-04'
