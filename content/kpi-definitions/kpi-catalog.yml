records:
  - schema_version: 1.0.0
    record_version: 1
    kpi_code: applications-developed
    name: Applications developed
    description: Distinct software applications completed or released within the declared scope.
    kpi_category: digitization-output
    applicable_system_types: [any]
    measurement_type: cumulative
    value_type: integer
    allowed_operators: [equal, greater-than, greater-than-or-equal, approximate, range, not-specified]
    allowed_units: [application]
    direction_of_improvement: increase
    aggregation: {method: count-unique, deduplication_key: dimensions.entity_ids, selection_rule: explicit-entity-union, notes: Aggregate only from stable non-personal application identifiers.}
    reporting_requirements: {reporting_period_required: true, activity_window_required: false, monitoring_period_required: false, statistic_required: false, source_verification_required: true, allowed_period_types: [as-of-date, year, date-range, lifetime, unknown]}
    display: {label: Applications developed, short_label: Applications, format: integer, decimal_places: 0, unit_label: applications, allowed_chart_types: [single-value, bar, table]}
    status: active

