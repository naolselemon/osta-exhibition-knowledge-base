records:
- schema_version: 1.0.0
  record_version: 1
  kpi_code: network-links
  name: Network links
  description: Connectivity links or VPN lines reported for a declared administrative
    layer or transmission technology.
  kpi_category: coverage
  applicable_system_types:
  - platform
  - integrated-system
  - other
  measurement_type: cumulative
  value_type: integer
  allowed_operators:
  - equal
  - greater-than
  - greater-than-or-equal
  - approximate
  - range
  - not-specified
  allowed_units:
  - link
  direction_of_improvement: increase
  aggregation:
    method: not-aggregatable
    deduplication_key: null
    selection_rule: latest-per-system-scope
    notes: Administrative-layer and technology counts are separate scopes and must
      not be added without an explicit non-overlap rule.
  reporting_requirements:
    reporting_period_required: true
    activity_window_required: false
    monitoring_period_required: false
    statistic_required: false
    source_verification_required: true
    allowed_period_types:
    - year
    - unknown
  display:
    label: Network links
    short_label: Network links
    format: integer
    decimal_places: 0
    unit_label: links
    allowed_chart_types:
    - single-value
    - bar
    - table
  status: active
