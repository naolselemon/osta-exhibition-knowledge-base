    translations: {}
    publication_status: draft
    verification_status: needs-review
    public_display_approved: false
    workflow: {state: needs-review, prepared_by_role: content-author, reviewed_by_role: null, created_at: '2026-09-04', updated_at: '2026-09-04', notes: Draft transformation story; validate the prior-state description and network claims before publication.}

