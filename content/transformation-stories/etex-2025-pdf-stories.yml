records:
  - schema_version: 1.0.0
    record_version: 1
    id: woredanet-connectivity-story
    system_id: woredanet-vpn
    title: WoredaNet extends shared digital access across government levels
    summary: The extraction describes a multi-level network connecting regional, zonal, city, woreda, and kebele offices for shared digital access.
    transformation_dimensions: [multiple-office-visits-to-remote-access]
    before:
      label: Disconnected office access
      description: Government offices depended on separate connectivity arrangements and physical coordination for shared digital work.
      service_steps: [visit or call another office, exchange information manually]
      evidence_notes: The PDF names the connected administrative levels; the prior-state process is an interpretation requiring source-owner review.
    after:
      label: Shared network access
      description: Connected offices use WoredaNet and VPN links for shared digital access and video conferencing.
      service_steps: [connect office to network, access shared service, coordinate remotely]
      evidence_notes: The PDF explicitly reports WoredaNet and VPN connectivity and lists shared access services.
    user_impact:
      beneficiaries: [regional offices, zonal offices, city offices, woreda offices, kebele offices]
      description: Network access is intended to reduce coordination travel and support remote government collaboration; measured impact is not verified.
    kpi_observation_refs: [woredanet-vpn-regional-lines-2025, woredanet-vpn-zone-city-lines-2025, woredanet-vpn-woreda-kebele-lines-2025]
