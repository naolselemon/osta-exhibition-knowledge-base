  - schema_version: 1.0.0
    record_version: 1
    id: rprs-land-registration-story
    system_id: rprs
    title: Real-property registration moves into digital workflows
    summary: The extraction describes map-based land information, real-property registration, digital certificates, and parcel migration.
    transformation_dimensions: [paper-application-to-online-application, difficult-tracking-to-end-to-end-tracking]
    before:
      label: Manual land administration
      description: Land applicants and administrators relied on non-digital registration and record-handling steps.
      service_steps: [submit land request, inspect paper record, follow up with office]
      evidence_notes: The PDF describes the digital workflow but does not document every prior-state step; confirm before publication.
    after:
      label: Digital property registration
      description: Real-property tasks, certificates, and migrated parcels are managed through a digital registration workflow.
      service_steps: [submit or register property record, process task, issue certificate, retrieve parcel record]
      evidence_notes: The PDF explicitly names RPRS and reports task, certificate, and parcel counters; their definitions require review.
    user_impact:
      beneficiaries: [land administrators, property holders, residents]
      description: Digital land workflows are intended to improve tracking and access to property records; measured impact is not verified.
