  - schema_version: 1.0.0
    record_version: 1
    id: regional-document-digitization-story
    system_id: regional-document-digitization
    title: Regional archives move from paper handling to searchable records
    summary: The extraction describes scanning, capture, indexing, and a searchable dashboard for regional document conversion.
    transformation_dimensions: [paper-file-to-digital-record]
    before:
      label: Paper archive
      description: Government records were held in paper archives that required physical handling.
      service_steps: [locate paper file, retrieve physical record, carry file between offices]
      evidence_notes: The PDF presents paper-to-digital conversion as the transformation context; detailed prior-state evidence requires review.
    after:
      label: Searchable digital record
      description: Scanned documents are captured, indexed, and managed through a searchable records dashboard.
      service_steps: [scan source document, capture digital file, index metadata, search managed record]
      evidence_notes: The PDF explicitly lists the scanning, capture, indexing, and dashboard workflow.
    user_impact:
      beneficiaries: [government institutions, records administrators, public-service users]
      description: Searchable records are intended to reduce physical-file handling and improve retrieval; measured impact is not verified.
